version: '3.8'

services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=mazyar_shop
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn --bind 0.0.0.0:8000 --workers 3 config.wsgi:application"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=your-secret-key-for-development
      # Option 1: Use local PostgreSQL container (uncomment the line below and comment Option 2)
      # - DB_NAME=mazyar_shop
      # - DB_USER=postgres
      # - DB_PASSWORD=postgres
      # - DB_HOST=db
      # - DB_PORT=5432
      # Option 2: Use Hamravesh External PostgreSQL (for development/testing)
      - DB_NAME=postgres
      - DB_USER=postgres
      - DB_PASSWORD=your-actual-database-password-here
      - DB_HOST=2bcb8ce3-1a34-49c0-8250-3279e4a5f494.hadb.ir
      - DB_PORT=27296
      - ALLOWED_HOSTS=localhost,127.0.0.1
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  static_volume:
  media_volume:

